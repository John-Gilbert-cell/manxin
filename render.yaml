# 慢信 · Render 部署配置
# 数据库使用外部 PostgreSQL（Neon 免费版），通过 DATABASE_URL 注入
services:
  - type: web
    name: manxin
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        value: manxin-admin-2026
      - key: RECEIVE_WAIT_SEC
        value: "15"
      - key: TRANSIT_MINUTES
        value: "0"
      - key: TZ
        value: Asia/Shanghai
