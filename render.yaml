# 慢信 · Render 部署配置
# 一体化：Web 服务 + PostgreSQL（免费档），点一次即可完成部署
databases:
  - name: manxin-db
    databaseName: manxin
    user: manxin
    plan: free
    region: singapore

services:
  - type: web
    name: manxin
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manxin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        value: manxin-admin-2026
      - key: RECEIVE_WAIT_SEC
        value: "15"
      - key: TRANSIT_MINUTES
        value: "0"
      - key: TZ
        value: Asia/Shanghai
